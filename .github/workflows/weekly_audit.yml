name: Weekly Social Media Audit (Agent 8)

on:
  schedule:
    # Every Sunday at 21:30 WIB (14:30 UTC) + watchdog at 22:15 WIB (15:15 UTC)
    - cron: "30 14 * * 0"
    - cron: "15 15 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: full_weekly_audit or send_flow_prompts_email"
        required: false
        default: "full_weekly_audit"
        type: choice
        options:
          - full_weekly_audit
          - send_flow_prompts_email

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  weekly-growth-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Guard Against Duplicate Weekly Schedule Run
        id: guard
        run: |
          SKIP="false"
          TODAY_WIB=$(TZ=Asia/Jakarta date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/weekly_audits/WEEKLY_AUDIT_${TODAY_WIB}.pdf" ]; then
            echo "Weekly audit PDF for ${TODAY_WIB} already exists — skipping watchdog."
            SKIP="true"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.12
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          pip install -r requirements.txt

      - name: Run Agent 8 Weekly Audit or Send Google AI Flow Prompts
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          YOUTUBE_WEBHOOK_URL: ${{ secrets.YOUTUBE_WEBHOOK_URL }}
          YOUTUBE_WEBHOOK_TOKEN: ${{ secrets.YOUTUBE_WEBHOOK_TOKEN }}
          STUDIO_SHEET_ID: ${{ secrets.STUDIO_SHEET_ID || vars.STUDIO_SHEET_ID }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          NOTIFY_EMAIL_ALSO: ${{ vars.NOTIFY_EMAIL_ALSO || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FLOW_CREDITS_REMAINING: ${{ vars.FLOW_CREDITS_REMAINING || '' }}
          AUDIT_DISPATCH_MODE: ${{ github.event.inputs.mode || 'full_weekly_audit' }}
        run: |
          if [ "$AUDIT_DISPATCH_MODE" = "send_flow_prompts_email" ]; then
            python -c "from src.tools.weekly_growth_auditor import send_flow_prompts_and_guide_email; res = send_flow_prompts_and_guide_email(); assert res.get('emailed_to') or res.get('telegram_sent'), f'Notification failed: {res}'"
          else
            python -c "from src.tools.weekly_growth_auditor import run_agent_8_weekly_audit; run_agent_8_weekly_audit()"
          fi

      - name: Commit Updated Cross-Agent Directives
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name "Everyday SciTech Studio Bot"
          git config user.email "bot@studio.local"
          for f in data/weekly_agent_directives.json data/mechanism_bank.json data/weekly_audits data/audience_requests.json data/memory.db data/STUDIO_MASTER_DATABASE.csv data/published_history.json data/FLOW_PROMPTS_LATEST.txt; do
            [ -e "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: Agent 8 weekly engagement audit & directives [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
