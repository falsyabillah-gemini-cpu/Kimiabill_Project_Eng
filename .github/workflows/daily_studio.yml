name: Daily Auto-Video (Bill_Explains Sci-Tech)

on:
  schedule:
    # Slot 1 (default DAILY_VIDEO_COUNT=1): Produce 19:30 WIB (12:30 UTC) -> Audit -> Publish 21:00 WIB (09:00 EST)
    - cron: "30 12 * * *"
    # Slot 2 (only when vars.DAILY_VIDEO_COUNT == '2'): Produce 20:15 WIB (13:15 UTC) -> Audit -> Publish 04:00 WIB (16:00 EST)
    - cron: "15 13 * * *"
  repository_dispatch:
    types:
      - telegram_feedback
      - telegram_approve
      - telegram_rerender
      - telegram_reject_next
      - telegram_ai_audit
      - telegram_save_backup
      - telegram_reject_use_backup
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Upload mode (draft = Unlisted Audit Gate [recommended] / dry_run = Drive only)"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - dry_run
      slot:
        description: "Target schedule slot (slot_2100 = 21:00 WIB / slot_0400 = 04:00 WIB)"
        required: false
        default: "slot_2100"
        type: choice
        options:
          - slot_2100
          - slot_0400
      target_publish_time_wib:
        description: "Optional override publish hour HH:MM WIB (e.g. 21:00 or 04:00)"
        required: false
        default: ""
        type: string
      resume_artifact_run_id:
        description: "Optional: GitHub Run ID to rescue-upload an existing video artifact"
        required: false
        default: ""
        type: string
      owner_feedback:
        description: "Optional: custom owner instruction for this episode"
        required: false
        default: ""
        type: string
      save_as_backup:
        description: "Save produced video straight into Standby Video Bank (kept unlisted reserve)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  produce-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      skip_duplicate: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Guard Against Duplicate Slot or Disabled Slot 2
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_COUNT: ${{ vars.DAILY_VIDEO_COUNT || '1' }}
        run: |
          SKIP="false"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "15 13 * * *" ] && [ "$DAILY_COUNT" != "2" ]; then
            echo "Slot 2 (04:00 WIB) disabled because DAILY_VIDEO_COUNT=$DAILY_COUNT (!= 2)."
            SKIP="true"
          fi
          if [ "$SKIP" != "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            ACTIVE=$(gh run list -R "${{ github.repository }}" --workflow daily_studio.yml --limit 10 --json databaseId,status,displayTitle --jq "[.[] | select((.status == \"in_progress\" or .status == \"queued\") and (.databaseId != ${{ github.run_id }}) and (.displayTitle != \"telegram_feedback\"))] | length")
            if [ "${ACTIVE:-0}" -gt 0 ]; then
              echo "Another production run is already active — skipping duplicate schedule run."
              SKIP="true"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - name: Setup Python 3.12
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Handle Lightweight Telegram Text Feedback
        if: ${{ steps.guard.outputs.skip != 'true' && github.event_name == 'repository_dispatch' && github.event.action == 'telegram_feedback' }}
        env:
          FB_TEXT: ${{ github.event.client_payload.text || github.event.client_payload.feedback || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          python - <<'PY'
          import os
          from src.tools.telegram_notify import handle_telegram_dispatch_feedback

          txt = os.environ.get("FB_TEXT", "").strip()
          if txt:
              res = handle_telegram_dispatch_feedback(txt, mode="next_video")
              print(f"[telegram] Compiled owner feedback into Agents 1-8 & Engine: {res}")
          PY
          git config user.name "Bill_Explains Studio Bot"
          git config user.email "bot@studio.local"
          git add data/owner_feedback.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: compile owner Telegram feedback to Agents 1-8 & engine [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi

      - name: Handle Lightweight Telegram Approve or Save-to-Video-Bank Dispatch
        if: ${{ steps.guard.outputs.skip != 'true' && github.event_name == 'repository_dispatch' && (github.event.action == 'telegram_approve' || github.event.action == 'telegram_save_backup') }}
        env:
          DISPATCH_ACTION: ${{ github.event.action }}
          DISPATCH_EP_ID: ${{ github.event.client_payload.episode_id || '' }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          YOUTUBE_WEBHOOK_URL: ${{ secrets.YOUTUBE_WEBHOOK_URL }}
          YOUTUBE_WEBHOOK_TOKEN: ${{ secrets.YOUTUBE_WEBHOOK_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q -r requirements.txt
          if [ "$DISPATCH_ACTION" = "telegram_save_backup" ]; then
            python -m src.scheduler save-backup --episode-id "$DISPATCH_EP_ID"
          else
            python -m src.scheduler approve --episode-id "$DISPATCH_EP_ID"
          fi
          git config user.name "Bill_Explains Studio Bot"
          git config user.email "bot@studio.local"
          for f in data/pending_review.json data/backup_queue.json data/published_history.json data/audience_requests.json; do
            [ -e "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update review & video bank state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi

      - name: Install FFmpeg & Dependencies
        if: ${{ steps.guard.outputs.skip != 'true' && !(github.event_name == 'repository_dispatch' && (github.event.action == 'telegram_feedback' || github.event.action == 'telegram_approve' || github.event.action == 'telegram_save_backup')) }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation
          pip install -q -r requirements.txt

      - name: Rescue Upload from Existing Artifact (Optional)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.resume_artifact_run_id != '' }}
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: "draft"
          ALLOW_DIRECT_PUBLIC: "false"
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          YOUTUBE_WEBHOOK_URL: ${{ secrets.YOUTUBE_WEBHOOK_URL }}
          YOUTUBE_WEBHOOK_TOKEN: ${{ secrets.YOUTUBE_WEBHOOK_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          NOTIFY_EMAIL_ALSO: ${{ vars.NOTIFY_EMAIL_ALSO || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          mkdir -p _rescue_art episodes
          gh run download "${{ inputs.resume_artifact_run_id }}" -D _rescue_art
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from src.pipeline import run_upload

          art_root = Path("_rescue_art")
          mp4 = next(art_root.rglob("FINAL_*.mp4"))
          src_dir = mp4.parent
          ep_id = src_dir.name if src_dir.name.startswith("ep_") else f"ep_rescue_{os.environ.get('GITHUB_RUN_ID', 'manual')}"
          ep_dir = Path("episodes") / ep_id
          ep_dir.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src_dir, ep_dir, dirs_exist_ok=True)
          state = run_upload(ep_id, allow_youtube=True, qa_summary="Rescue Upload QA Passed")
          shutil.rmtree(art_root, ignore_errors=True)
          print(f"[rescue] Uploaded unlisted draft to YouTube: {state.youtube_url}")
          PY

      - name: Run Production or Interactive Dispatch Action
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.resume_artifact_run_id == '' && !(github.event_name == 'repository_dispatch' && (github.event.action == 'telegram_feedback' || github.event.action == 'telegram_approve' || github.event.action == 'telegram_save_backup')) }}
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
          CHIEF_EDITOR_MODEL: ${{ vars.CHIEF_EDITOR_MODEL || 'gemini-3.8-flash' }}
          PUBLISH_MODE: ${{ inputs.publish_mode || 'draft' }}
          ALLOW_DIRECT_PUBLIC: "false"
          STUDIO_SLOT: ${{ inputs.slot || ((github.event.schedule == '15 13 * * *') && 'slot_0400' || 'slot_2100') }}
          TARGET_PUBLISH_TIME_WIB: ${{ inputs.target_publish_time_wib || ((github.event.schedule == '15 13 * * *' || inputs.slot == 'slot_0400') && '04:00' || '21:00') }}
          SKIP_IF_SLOT_PUBLISHED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          SAVE_AS_BACKUP: ${{ inputs.save_as_backup || 'false' }}
          ALLOW_BACKUP_FALLBACK: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          YOUTUBE_WEBHOOK_URL: ${{ secrets.YOUTUBE_WEBHOOK_URL }}
          YOUTUBE_WEBHOOK_TOKEN: ${{ secrets.YOUTUBE_WEBHOOK_TOKEN }}
          STUDIO_SHEET_ID: ${{ secrets.STUDIO_SHEET_ID || vars.STUDIO_SHEET_ID }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          NOTIFY_EMAIL_ALSO: ${{ vars.NOTIFY_EMAIL_ALSO || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OWNER_FEEDBACK_OVERRIDE: ${{ github.event.inputs.owner_feedback || github.event.client_payload.feedback || '' }}
          DISPATCH_ACTION: ${{ github.event.action || '' }}
          DISPATCH_EP_ID: ${{ github.event.client_payload.episode_id || '' }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          if [ "$DISPATCH_ACTION" = "telegram_rerender" ]; then
            python -m src.scheduler rerender --episode-id "$DISPATCH_EP_ID" --feedback "$OWNER_FEEDBACK_OVERRIDE"
          elif [ "$DISPATCH_ACTION" = "telegram_reject_next" ]; then
            python -m src.scheduler reject-next --episode-id "$DISPATCH_EP_ID"
          elif [ "$DISPATCH_ACTION" = "telegram_reject_use_backup" ]; then
            python -m src.scheduler reject-backup --episode-id "$DISPATCH_EP_ID"
          elif [ "$DISPATCH_ACTION" = "telegram_ai_audit" ]; then
            python -m src.chief_editor_audit audit --episode-id "$DISPATCH_EP_ID"
          else
            if [ -n "$OWNER_FEEDBACK_OVERRIDE" ]; then
              python -c "import os; from src.tools.telegram_notify import record_owner_feedback; record_owner_feedback(os.environ['OWNER_FEEDBACK_OVERRIDE'], mode='rerender')"
            fi
            python -m src.scheduler run --slot "$STUDIO_SLOT"
          fi

      - name: Commit Studio State (Pending Review, Video Bank, Rejected & History)
        if: ${{ steps.guard.outputs.skip != 'true' && !(github.event_name == 'repository_dispatch' && (github.event.action == 'telegram_feedback' || github.event.action == 'telegram_approve' || github.event.action == 'telegram_save_backup')) }}
        run: |
          git config user.name "Bill_Explains Studio Bot"
          git config user.email "bot@studio.local"
          for f in data/pending_review.json data/backup_queue.json data/rejected_topics.json data/published_history.json data/audience_requests.json data/memory.db data/owner_feedback.json; do
            [ -e "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update studio review, video bank & history state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          fi

      - name: Upload Rendered Video Artifact
        if: ${{ steps.guard.outputs.skip != 'true' && !(github.event_name == 'repository_dispatch' && (github.event.action == 'telegram_feedback' || github.event.action == 'telegram_approve' || github.event.action == 'telegram_save_backup')) }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-episode-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            episodes/*/FINAL_*.mp4
            episodes/*/THUMBNAIL_*.jpg
            episodes/*/CAPTION_SIAP_UPLOAD.txt
            episodes/*/*_contact_sheet.jpg
            episodes/*/handoffs/*.json
