name: Check Google Apps Script Deploy

on:
  workflow_dispatch:

jobs:
  verify-apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Minimal Requests Package
        run: pip install -q requests pyyaml

      - name: Ping & Verify Deployed Google Apps Script Webhook
        env:
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          YOUTUBE_WEBHOOK_URL: ${{ secrets.YOUTUBE_WEBHOOK_URL }}
          YOUTUBE_WEBHOOK_TOKEN: ${{ secrets.YOUTUBE_WEBHOOK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests
          from src.tools.gdrive_sync import _normalize_webhook_url

          raw_drive_url = os.environ.get("GDRIVE_WEBHOOK_URL", "").strip()
          if not raw_drive_url:
              print("ERROR: GDRIVE_WEBHOOK_URL secret is empty!")
              sys.exit(1)

          drive_url = _normalize_webhook_url(raw_drive_url)
          drive_token = os.environ.get("GDRIVE_WEBHOOK_TOKEN", "").strip()

          raw_yt_url = os.environ.get("YOUTUBE_WEBHOOK_URL", "").strip()
          yt_url = _normalize_webhook_url(raw_yt_url) if raw_yt_url else drive_url
          yt_token = os.environ.get("YOUTUBE_WEBHOOK_TOKEN", "").strip() if raw_yt_url else drive_token

          g = requests.get(drive_url, timeout=30)
          print("1. Drive GET status:", g.status_code, "body:", g.text[:300])
          if raw_yt_url:
              g_yt = requests.get(yt_url, timeout=30)
              print("1b. YouTube GET status:", g_yt.status_code, "body:", g_yt.text[:300])

          p_drive = requests.post(
              drive_url,
              json={"action": "list_flow_clips", "token": drive_token},
              timeout=45,
          ).json()
          print("1c. Pro Drive Flow_Clip_Bank ok:", p_drive.get("ok"), "clips:", len(p_drive.get("clips") or []))

          p_yt = requests.post(
              yt_url,
              json={"action": "get_youtube_stats", "token": yt_token, "max_results": 2},
              timeout=45,
          ).json()
          ch = p_yt.get("channel", {})
          yt_summary = {
              "ok": p_yt.get("ok"),
              "error": p_yt.get("error"),
              "analytics_enabled": p_yt.get("analytics_enabled"),
              "channel": ch.get("title"),
              "subscribers": ch.get("subscribers"),
              "total_views": ch.get("total_views"),
              "videos_checked": len(p_yt.get("videos", [])),
          }
          print("2. get_youtube_stats check:", json.dumps(yt_summary, ensure_ascii=False))

          p_cmt = requests.post(yt_url, json={"action": "post_comment", "token": yt_token}, timeout=30).json()
          p_th = requests.post(yt_url, json={"action": "set_thumbnail", "token": yt_token}, timeout=30).json()
          cmt_deployed = "Unknown action" not in str(p_cmt.get("error", ""))
          th_deployed = "Unknown action" not in str(p_th.get("error", ""))
          print("3. post_comment handler:", cmt_deployed, "4. set_thumbnail handler:", th_deployed)

          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if tg_token:
              wh = requests.get(f"https://api.telegram.org/bot{tg_token}/getWebhookInfo", timeout=15).json()
              res = wh.get("result") or {}
              print("5. Telegram getWebhookInfo:", json.dumps({
                  "ok": wh.get("ok"),
                  "has_webhook_url": bool(res.get("url")),
                  "pending_update_count": res.get("pending_update_count"),
                  "last_error_message": res.get("last_error_message") or None,
              }))
          else:
              print("5. Telegram getWebhookInfo: TELEGRAM_BOT_TOKEN secret is empty!")

          if not p_drive.get("ok") or not p_yt.get("ok") or not cmt_deployed or not th_deployed:
              sys.exit(1)
          print("ALL APPS SCRIPT CHECKS PASSED!")
          PY
